[package]
name = "arkhe-vision"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
bytes = "1.5"

# Image processing
image = "0.24"

# ONNX Runtime (YOLO26)
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }
ndarray = "0.17"

# PyTorch (SAM 3.1) - requires libtorch
tch = { version = "0.14", features = ["download-libtorch"] }  # or use system libtorch

# gRPC (WormGraph)
tonic = "0.11"
prost = "0.12"

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { version = "0.13", features = ["process"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Utilities
futures = "0.3"
rand = "0.8"

[build-dependencies]
# Para compilar com libtorch se necessário
