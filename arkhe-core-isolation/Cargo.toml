[package]
name = "arkhe-core-isolation"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43.0", features = ["full", "macros"] }
secrecy = { version = "0.10.3", features = ["serde"] }
chrono = { version = "0.4.39", features = ["clock", "serde"] }
aes-gcm = "0.10.3"
aead = "0.5.2"
rand = "0.8.5"
thiserror = "2.0.11"
tracing = "0.1.41"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
zeroize = "1.9.0"

[workspace]
